name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build and publish updater artifacts
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Audio Switcher ${{ github.ref_name }}
          releaseBody: |
            ## 更新内容

            - 重构 WinIsland 风格的单容器展开与收起动画，减少胶囊和面板切换时的闪烁与断帧。
            - 优化多套音频输入、输出设备的切换、静音和音量调整体验。
            - 新增剪贴板历史面板，支持文本与图片保存、预览和再次复制。
            - 拆分 React 音频面板、剪贴板面板、设置面板和窗口状态逻辑，提升代码可维护性。
            - 新增 GitHub Actions 自动构建 Windows 安装包与 Tauri 更新文件。

            详细文件请见下方附件。
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          tauriScript: npx tauri
